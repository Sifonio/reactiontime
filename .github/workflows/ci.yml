name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      # 3. Мультиверсійне тестування
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pytest-html
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fury; fi

      # 2. Перевірка стилю коду (Linting)
      - name: Lint with flake8
        run: |
          # зупинка білду, якщо є помилки синтаксису або невизначені змінні
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # попередження для всього іншого
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 1. Автоматичне тестування з Pytest
      # 5. Автоматичний HTML-звіт
      - name: Test with pytest and generate HTML report
        run: |
          pytest --html=report.html --self-contained-html

      # Завантаження звіту як артефакту (щоб його можна було завантажити)
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-python-${{ matrix.python-version }}
          path: report.html

  # 4. Збірка Docker-контейнера
  build-docker:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t reactiontime-app:latest .
          
      - name: List Docker Images
        run: docker images
